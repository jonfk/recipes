name: Easy Berry Chia Jam
description: Berry jam thickened with chia seeds
source: Kylie Sakaida (Nutrition By Kylie)
links:
  - https://www.youtube.com/shorts/Hsxv7tkl3i4
  - https://www.youtube.com/watch?v=Hsxv7tkl3i4&lc=Ugwljx4YmnMKHn2T5wJ4AaABAg
  - https://nutritionbykylie.substack.com/p/easy-5-ingredient-chia-jam
ingredients:
  - name: frozen berries
    quantity: 2 cups
  - name: water
    quantity: 1/4 cup
  - name: honey
    quantity: 1 tbsp
  - name: chia seeds
    quantity: 3 tbsp
  - name: fresh lemon juice
    quantity: a squeeze
timings:
  - time: 5min
    for: softening the berries
  - time: 2-3min
    for: cooking after adding chia seeds
  - time: 5-10min
    for: cooling and thickening
notes:
  - Adjust the sweetness to taste.
  - Serve with yogurt, oatmeal, toast, pancakes, or waffles.
instructions:
  - Heat the frozen berries, water, and honey in a small saucepan over medium heat for about 5 minutes, until soft and juicy.
  - Mash the berries with a spoon or potato masher to your preferred texture.
  - Mix in the chia seeds and lemon juice.
  - Cook for another 2-3 minutes, stirring frequently.
  - Remove from the heat and leave for 5-10 minutes to thicken as it cools.
